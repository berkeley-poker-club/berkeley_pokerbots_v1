[package]
name = "competition-platform"
version = "0.2.0"
edition = "2021"
description = "Pokerbots competition platform: submission API, job queue, tournament workers, sandbox, leaderboard"
license = "MIT"

[lib]
name = "competition_platform"
path = "src/lib.rs"

[[bin]]
name = "competition-api"
path = "src/bin/competition_api.rs"

[[bin]]
name = "tournament-worker"
path = "src/bin/tournament_worker.rs"

[dependencies]
poker-utils = { path = "../poker-utils" }
table-runner = { path = "../table-runner" }
tournament-core = { path = "../tournament-core" }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
http = "1"
bytes = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
