[package]
name = "pokerbots-cli"
version = "0.2.0"
edition = "2021"
description = "Local tournament runner, smoke tester and reference stdio bots"
license = "MIT"

[[bin]]
name = "pokerbots"
path = "src/main.rs"

[dependencies]
poker-utils = { path = "../poker-utils" }
table-runner = { path = "../table-runner" }
tournament-core = { path = "../tournament-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
