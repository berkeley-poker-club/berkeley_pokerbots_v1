# Configuration used by deploy/docker-compose.yml (paths are inside the containers == host paths).
[server]
bind = "0.0.0.0:8080"
embedded_workers = 0

[storage]
database = "/srv/pokerbots/data/pokerbots.db"
artifacts_dir = "/srv/pokerbots/data/artifacts"
logs_dir = "/srv/pokerbots/data/logs"

[worker]
concurrency = 2
max_bots_in_flight = 600

[autoscaler]
backend = "command"
poll_secs = 30
scale_command = "docker compose -f /srv/pokerbots/deploy/docker-compose.yml up -d --no-recreate --scale worker={n}"

[sandbox]
kind = "docker"
memory_mb = 512
max_pids = 64

[defaults]
nightly_time_utc = "07:00"

[defaults.autoscale]
enabled = true
min_workers = 1
max_workers = 6
worker_concurrency = 2
max_bots_per_worker = 600
nightly_deadline_hours = 6.0
nightly_series_length = 100
ondemand_runs_per_team_per_day = 2
ondemand_max_series_length = 10
