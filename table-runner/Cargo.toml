[package]
name = "table-runner"
version = "0.2.0"
edition = "2021"
description = "Async table driver: connects the poker engine to bots (in-process or JSON-lines subprocesses)"
license = "MIT"

[dependencies]
poker-utils = { path = "../poker-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
rand = "0.9"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
