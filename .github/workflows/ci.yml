name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke-test reference bots
        run: |
          cargo build --release -p pokerbots-cli
          for b in fold_bot call_bot raise_bot random_bot template_bot; do
            ./target/release/pokerbots smoke --bot python:bots/python/$b.py
          done
          ./target/release/pokerbots tournament --bot python:bots/python/call_bot.py --bot python:bots/python/raise_bot.py --bot builtin:random --players 27 --no-time-levels
