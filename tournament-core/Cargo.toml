[package]
name = "tournament-core"
version = "0.2.0"
edition = "2021"
description = "Tournament director: multi-table NLHE tournaments, table breaking, blind levels, placements, series scoring"
license = "MIT"

[dependencies]
poker-utils = { path = "../poker-utils" }
table-runner = { path = "../table-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
rand = "0.9"
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
